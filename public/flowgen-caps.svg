<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Glow filter replicating drop-shadow-[0_0_35px_rgba(255,255,255,0.4)] -->
    <filter id="flowgen-glow-caps" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feFlood flood-color="#ffffff" flood-opacity="0.45" result="color" />
      <feComposite in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic shine gradient matching ShinyText -->
    <linearGradient id="flowgen-shimmer-caps" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#f5f3ff" stop-opacity="1" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <style>
    .flowgen-caps-title {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      font-weight: 900;
      font-size: 190px;
      letter-spacing: -0.05em;
      fill: url(#flowgen-shimmer-caps);
      filter: url(#flowgen-glow-caps);
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Big FLOWGEN All-Caps Text -->
  <text x="600" y="160" class="flowgen-caps-title">FLOWGEN</text>
</svg>
